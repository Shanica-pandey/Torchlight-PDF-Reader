<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="TorchRead is a focused PDF reader built around an immersive, customizable torchlight."
    />

    <title>TorchRead — Focused PDF Reading</title>
  </head>

  <body hidden>
    <!-- Landing Screen -->
    <main id="landing-screen">
      <div class="landing-content">
        <h1>TorchRead</h1>
        <p>Read differently.</p>

        <label for="book-file" class="upload-button">
          Choose a PDF
        </label>

        <input
          type="file"
          id="book-file"
          accept="application/pdf"
          hidden
        />

        <p class="privacy-note">
          Your PDF stays in your browser.
        </p>
      </div>
    </main>

    <!-- Reader Screen -->
    <main id="reader-screen" hidden>
      <!-- Top Toolbar -->
      <header class="reader-toolbar">
        <div class="toolbar-left">
          <button id="back-button" type="button" aria-label="Back to home">
            ←
          </button>

          <span id="document-name">No document</span>
        </div>

        <div class="page-controls">
          <button id="previous-page" type="button" aria-label="Previous page">
            ←
          </button>

          <span id="page-indicator">0 / 0</span>

          <button id="next-page" type="button" aria-label="Next page">
            →
          </button>
        </div>

        <div class="toolbar-right">
          <button id="zoom-out" type="button" aria-label="Zoom out">
            −
          </button>

          <span id="zoom-level">100%</span>

          <button id="zoom-in" type="button" aria-label="Zoom in">
            +
          </button>

          <button
            id="fullscreen-button"
            type="button"
            aria-label="Toggle fullscreen"
          >
            ⛶
          </button>
        </div>
      </header>

      <!-- PDF Reading Area -->
      <section id="reader-area">
        <div id="pdf-container">
          <canvas id="pdf-canvas"></canvas>
        </div>

        <!-- Torch Overlay -->
        <div id="dark-overlay"></div>
      </section>

      <!-- Torch Controls -->
      <footer class="torch-controls">
        <label for="torch-size">Torch size</label>

        <input
          type="range"
          id="torch-size"
          min="50"
          max="250"
          value="100"
        />

        <button id="torch-toggle" type="button">
          Torch
        </button>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
